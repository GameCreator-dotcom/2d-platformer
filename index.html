<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2D Platformer</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-heading">
        <p class="eyebrow">A tiny platform adventure</p>
        <h1>2D Platformer</h1>
      </header>
      <canvas id="game" width="800" height="450" aria-label="2D platform game"></canvas>
      <p class="controls">Move: A / D or arrow keys <span aria-hidden="true">·</span> Jump: W, up, or space</p>
    </main>
  </body>
</html>
